name: Protected MSIX signing proof

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msix-signing-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: windows-2025
    timeout-minutes: 120
    environment:
      name: msix-signing-proof
    steps:
      - name: Check out the protected tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pnpm 11.3.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.3.0

      - name: Install Node 22.23.1
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install Python 3.12.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            tts_sidecar/requirements.txt
            tts_sidecar/requirements-build.txt

      - name: Install frozen JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run source gates before release assembly
        shell: pwsh
        run: |
          pnpm lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tts_sidecar -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Acquire and verify approved binary and model inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'adaptive-audio-release'
          if (Test-Path -LiteralPath $releaseRoot) {
            throw "Release root must be fresh: $releaseRoot"
          }
          $inputsRoot = Join-Path $releaseRoot 'inputs'
          $modelRoot = Join-Path $inputsRoot 'models\f3ff3571791e39611d31c381e3a41a3af07b4987'
          New-Item -ItemType Directory -Path (Join-Path $modelRoot 'voices') -Force | Out-Null

          function Get-VerifiedFile {
            param(
              [Parameter(Mandatory = $true)][string]$Uri,
              [Parameter(Mandatory = $true)][string]$Destination,
              [Parameter(Mandatory = $true)][string]$Sha256
            )
            New-Item -ItemType Directory -Path (Split-Path -Parent $Destination) -Force | Out-Null
            Invoke-WebRequest -Uri $Uri -OutFile $Destination
            $actual = (Get-FileHash -LiteralPath $Destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Sha256) {
              throw "Downloaded input failed SHA-256 verification: $(Split-Path -Leaf $Destination)"
            }
          }

          $revision = 'f3ff3571791e39611d31c381e3a41a3af07b4987'
          $modelBase = "https://huggingface.co/hexgrad/Kokoro-82M/resolve/$revision"
          Get-VerifiedFile "$modelBase/kokoro-v1_0.pth?download=true" (Join-Path $modelRoot 'kokoro-v1_0.pth') '496dba118d1a58f5f3db2efc88dbdc216e0483fc89fe6e47ee1f2c53f18ad1e4'
          Get-VerifiedFile "$modelBase/config.json?download=true" (Join-Path $modelRoot 'config.json') '5abb01e2403b072bf03d04fde160443e209d7a0dad49a423be15196b9b43c17f'
          Get-VerifiedFile "$modelBase/voices/af_heart.pt?download=true" (Join-Path $modelRoot 'voices\af_heart.pt') '0ab5709b8ffab19bfd849cd11d98f75b60af7733253ad0d67b12382a102cb4ff'
          Get-VerifiedFile "$modelBase/voices/af_bella.pt?download=true" (Join-Path $modelRoot 'voices\af_bella.pt') '8cb64e02fcc8de0327a8e13817e49c76c945ecf0052ceac97d3081480e8e48d6'
          Get-VerifiedFile "$modelBase/voices/am_michael.pt?download=true" (Join-Path $modelRoot 'voices\am_michael.pt') '9a443b79a4b22489a5b0ab7c651a0bcd1a30bef675c28333f06971abbd47bd37'

          $nodeZip = Join-Path $inputsRoot 'node-v22.23.1-win-x64.zip'
          Get-VerifiedFile 'https://nodejs.org/dist/v22.23.1/node-v22.23.1-win-x64.zip' $nodeZip '7df0bc9375723f4a86b3aa1b7cc73342423d9677a8df4538aca31a049e309c29'
          $nodeExtract = Join-Path $inputsRoot 'node-runtime'
          Expand-Archive -LiteralPath $nodeZip -DestinationPath $nodeExtract
          $nodeRuntime = Join-Path $nodeExtract 'node-v22.23.1-win-x64'

          $electronZip = Join-Path $inputsRoot 'electron-v43.1.1-win32-x64.zip'
          Get-VerifiedFile 'https://github.com/electron/electron/releases/download/v43.1.1/electron-v43.1.1-win32-x64.zip' $electronZip 'b4e9995cd3f65785eb8818276aa9020f3165ab11da41b3c762616d4a0ad8c7ad'

          "RELEASE_ROOT=$releaseRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_INPUTS=$inputsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_MODEL_ROOT=$modelRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NODE_RUNTIME=$nodeRuntime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assemble verified unsigned MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RELEASE_ROOT 'stage'
          $sidecarOutput = Join-Path $env:RELEASE_ROOT 'sidecar'
          $shellInput = Join-Path $env:RELEASE_ROOT 'shell'
          $runtime = Join-Path $env:RELEASE_ROOT 'runtime'
          $electronOutput = Join-Path $env:RELEASE_ROOT 'electron'
          $unsignedOutput = Join-Path $env:RELEASE_ROOT 'AdaptiveAudioPlayer-0.1.0.0-x64-unsigned.msix'

          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/stage-next-standalone.mjs --project-root $env:GITHUB_WORKSPACE --output $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build-tts-sidecar.py --output $sidecarOutput --model-source $env:RELEASE_MODEL_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/packager.mjs --input $shellInput --output $electronOutput --electron-zip-dir $env:RELEASE_INPUTS --runtime $runtime --node-runtime $env:RELEASE_NODE_RUNTIME --app-stage $stage --sidecar (Join-Path $sidecarOutput 'AdaptiveAudioPlayerTTS')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $bundle = Join-Path $electronOutput 'Adaptive Audio Player-win32-x64'
          $makeAppx = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe'
          node scripts/build-msix.mjs --input $bundle --output $unsignedOutput --makeappx $makeAppx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UNSIGNED_MSIX=$unsignedOutput" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign and verify protected test package
        shell: pwsh
        env:
          MSIX_SIGNING_MODE: test
          MSIX_SIGNING_PFX_BASE64: ${{ secrets.MSIX_SIGNING_PFX_BASE64 }}
          MSIX_SIGNING_PFX_PASSWORD: ${{ secrets.MSIX_SIGNING_PFX_PASSWORD }}
          MSIX_EXPECTED_PUBLISHER: ${{ vars.MSIX_EXPECTED_PUBLISHER }}
          MSIX_TIMESTAMP_URL: ${{ vars.MSIX_TIMESTAMP_URL }}
        run: |
          $signedOutput = Join-Path $env:RELEASE_ROOT 'AdaptiveAudioPlayer-0.1.0.0-x64-test-signed.msix'
          $evidenceOutput = Join-Path $env:RELEASE_ROOT 'signing-evidence.json'
          node scripts/sign-msix.mjs --input $env:UNSIGNED_MSIX --output $signedOutput --evidence $evidenceOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SIGNED_MSIX=$signedOutput" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_EVIDENCE=$evidenceOutput" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload signed proof and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adaptive-audio-player-${{ github.ref_name }}-test-signed
          path: |
            ${{ env.SIGNED_MSIX }}
            ${{ env.SIGNING_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
