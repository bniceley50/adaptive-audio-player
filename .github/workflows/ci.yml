name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: tts_sidecar/requirements.txt

      - run: pnpm install --frozen-lockfile

      - name: Install Python sidecar dependencies
        run: python -m pip install --requirement tts_sidecar/requirements.txt

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and route tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Core listening E2E
        run: pnpm test:e2e --grep "core listening"

      - name: Python sidecar tests
        run: python -m unittest discover tts_sidecar
